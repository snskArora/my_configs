# set-option -g default-terminal 'screen-256color'
# set-option -g terminal-overrides ',xterm-256color:RGB'

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"

# update prefix_key/leader_key to <ALT> + q
unbind C-b
set -g prefix M-q
bind M-q send-prefix

# enable mouse actions
set -g mouse on

# Session mgmt
bind N command-prompt -p "New Session:" "new-session -A -s '%%'"
bind K confirm kill-session
bind R command-prompt -I '#S' 'rename-session "%%"'

# Start window indexing from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split bindings to mirror Ghostty:
# M-q s r = split right
# M-q s d = split down
# M-q s l = split left
# M-q s u = split up
bind-key -T prefix s switch-client -T split_table
bind-key -T split_table r split-window -h -c "#{pane_current_path}"
bind-key -T split_table d split-window -v -c "#{pane_current_path}"
bind-key -T split_table l split-window -hb -c "#{pane_current_path}"
bind-key -T split_table u split-window -vb -c "#{pane_current_path}"
bind-key -T split_table e select-layout tiled

# Pane navigation like Ghostty Alt+arrows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Zoom / close equivalents
bind -n M-z resize-pane -Z
bind -n M-x kill-pane

# Tab/window equivalents
bind t new-window -c "#{pane_current_path}"
bind k kill-window
bind -n C-Left previous-window
bind -n C-Right next-window
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

# Session chooser
bind S choose-session

# Resize shortcuts inspired by Ghostty
bind -r S-Up    resize-pane -U 10
bind -r S-Down  resize-pane -D 10
bind -r S-Left  resize-pane -L 10
bind -r S-Right resize-pane -R 10

bind -r C-S-Up    resize-pane -U 60
bind -r C-S-Down  resize-pane -D 60
bind -r C-S-Left  resize-pane -L 60
bind -r C-S-Right resize-pane -R 60

# Other settings
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set-option -g status-position top
set -g status-bg black
set -g status-fg white
set -g pane-border-format "#{pane_index} #{pane_current_command}"
